# Build and deploy the Supermarket website and API to Azure

name: Build and deploy Supermarket website and API

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test and lint frontend
        working-directory: frontend
        run: |
          npm test
          npm run lint

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        run: dotnet build backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release

      - name: Test API
        run: dotnet test backend/Supermarket.Api.Tests/Supermarket.Api.Tests.csproj --configuration Release --verbosity minimal

      - name: Publish API
        run: dotnet publish backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release --output ./publish

      - name: Include frontend in the published app
        run: |
          mkdir -p ./publish/wwwroot
          cp -a frontend/dist/. ./publish/wwwroot/

      - name: Test published website with an unavailable database
        run: node --test tests/smoke.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Check Azure secrets
        shell: bash
        env:
          AZURE_CLIENTID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C18E9507AB78472590C5CCCA8DEABFD2 }}
          AZURE_TENANTID: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF33ED18560040CD9E1A019730D59F70 }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D70F53276BF497CA47B795AB54CC90E }}
        run: |
          missing=0
          for name in AZURE_CLIENTID AZURE_TENANTID AZURE_SUBSCRIPTIONID; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Missing or empty Azure credential: $name. Check the GitHub Actions secret referenced in this step. Configure it in Settings > Secrets and variables > Actions. If it is an environment secret, set the matching environment on the deploy job."
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi
          echo "All required Azure secrets are present."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C18E9507AB78472590C5CCCA8DEABFD2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF33ED18560040CD9E1A019730D59F70 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D70F53276BF497CA47B795AB54CC90E }}


      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: supermarket-api-ll
          slot-name: Production
          package: ./publish

      - name: Verify website and database readiness
        env:
          SITE_URL: https://supermarket-api-ll-ghgbdth2hsaqc3bh.denmarkeast-01.azurewebsites.net
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 15 --retry-max-time 180 "$SITE_URL/" --output /tmp/supermarket-home.html
          if ! grep -q '<div id="root"></div>' /tmp/supermarket-home.html; then
            echo "::error::The deployed homepage is not the React website. Check the published wwwroot files."
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 --connect-timeout 10 --max-time 15 --retry-max-time 180 "$SITE_URL/health/ready"; then
            echo "::error::The app was uploaded but is not ready. Check the .NET 10 runtime, the App Service DefaultConnection connection string, SQL network access, and applied EF migrations. See docs/azure-deployment.md."
            exit 1
          fi
