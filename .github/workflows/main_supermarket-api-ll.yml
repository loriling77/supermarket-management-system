
# Build and deploy Supermarket ASP.NET Core API to Azure

name: Build and deploy Supermarket API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        run: dotnet build backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release

      - name: Publish API
        run: dotnet publish backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}
          

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: supermarket-api-ll
          slot-name: Production
          package: ./publish

          run: |
          if [ -n "$CLIENT_ID" ]; then echo "CLIENT_ID: PRESENT"; else echo "CLIENT_ID: MISSING"; fi
          if [ -n "$TENANT_ID" ]; then echo "TENANT_ID: PRESENT"; else echo "TENANT_ID: MISSING"; fi
          if [ -n "$SUBSCRIPTION_ID" ]; then echo "SUBSCRIPTION_ID: PRESENT"; else echo "SUBSCRIPTION_ID: MISSING"; fi
