# Build and deploy Supermarket ASP.NET Core API to Azure

name: Build and deploy Supermarket API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        run: dotnet build backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release

      - name: Publish API
        run: dotnet publish backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: Check Azure secrets
        shell: bash
        env:
          AZURE_CLIENTID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C18E9507AB78472590C5CCCA8DEABFD2 }}
          AZURE_TENANTID: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF33ED18560040CD9E1A019730D59F70 }}
          AZURE_SUBSCRIPTIONID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D70F53276BF497CA47B795AB54CC90E }}
        run: |
          missing=0
          for name in AZURE_CLIENTID AZURE_TENANTID AZURE_SUBSCRIPTIONID; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then
              echo "::error::Missing or empty Azure credential: $name. Check the GitHub Actions secret referenced in this step. Configure it in Settings > Secrets and variables > Actions. If it is an environment secret, set the matching environment on the deploy job."
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi
          echo "All required Azure secrets are present."

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C18E9507AB78472590C5CCCA8DEABFD2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF33ED18560040CD9E1A019730D59F70 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D70F53276BF497CA47B795AB54CC90E }}


      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: supermarket-api-ll
          slot-name: Production
          package: ./publish
