
# Build and deploy Supermarket ASP.NET Core API to Azure

name: Build and deploy Supermarket API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build API
        run: dotnet build backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release

      - name: Publish API
        run: dotnet publish backend/Supermarket.Api/Supermarket.Api.csproj --configuration Release --output ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
      
      - name: Check Azure secrets
        env:
          CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C18E9507AB78472590C5CCCA8DEABFD2 }}
          TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID_BF33ED18560040CD9E1A019730D59F70 }}
          SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D70F53276BF497CA47B795AB54CC90E }}
        run: |
          test -n "$CLIENT_ID" && echo "CLIENT_ID PRESENT" || echo "CLIENT_ID MISSING"
          test -n "$TENANT_ID" && echo "TENANT_ID PRESENT" || echo "TENANT_ID MISSING"
          test -n "$SUBSCRIPTION_ID" && echo "SUBSCRIPTION_ID PRESENT" || echo "SUBSCRIPTION_ID MISSING"
   
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENTID }}
          tenant-id: ${{ secrets.AZURE_TENANTID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTIONID }}
          

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: supermarket-api-ll
          slot-name: Production
          package: ./publish

        
